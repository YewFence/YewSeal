# YewSeal 配置文件
# 
# 配置优先级：
# 1. 命令行参数（最高优先级）
# 2. 环境变量
# 3. 此配置文件
# 4. 默认值（最低优先级）

[encryption]
# 需要加密的输入文件（TOML 格式）
input_file = "wrangler.toml"

# 加密后的输出文件（YAML 格式）
output_file = "wrangler.enc.toml.yaml"

[key]
# Age 私钥文件路径
# 默认值: ".age/keys.txt"
# 重要提示：该配置文件不应该存储密钥值本身！
file_path = ".age/keys.txt"

# Age 公钥（用于加密，可以安全提交到版本控制）
public_key = "age1eyqz75h6fpp806svdue9h4ntwjmjgldw4a23tfy6hvny6hvz45hs68z6ru"
