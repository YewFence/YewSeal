[tools]
git-cliff = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"aqua:ko-build/ko" = "0.19"

[tasks.audit]
description = "Run Go dependency verification and vulnerability checks"
run = [
  { task = "mod:verify" },
  { task = "vuln:check" },
]

[tasks."vuln:check"]
description = "Run Go vulnerability checks"
run = "govulncheck ./..."

[tasks.'mod:verify']
description = "Verify Go module dependencies"
run = "go mod verify"

[tasks."container:build"]
description = "Build the CLI container image in the local Docker-compatible daemon"
shell = "bash -c"
run = """
repository="$(printf '%s' "${CONTAINER_IMAGE_REPOSITORY:-ko.local}" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
if [[ "${repository}" != "ko.local" ]]; then
  registry="${repository%%/*}"
  if [[ "${repository}" != */* || ( "${registry}" != *.* && "${registry}" != *:* && "${registry}" != "localhost" ) ]]; then
    echo "CONTAINER_IMAGE_REPOSITORY must be a complete registry/repository name" >&2
    exit 1
  fi
fi
platform_args=()
if [[ -n "${CONTAINER_IMAGE_PLATFORM:-}" ]]; then
  platform_args+=(--platform "${CONTAINER_IMAGE_PLATFORM}")
fi

KO_DOCKER_REPO="${repository}" ko build --local --tags dev "${platform_args[@]}" ./cmd/yews
"""

[tasks."container:publish"]
description = "Publish the release CLI container image to GHCR"
shell = "bash -c"
run = """
release_tag="${RELEASE_TAG:?RELEASE_TAG is required}"
release_prerelease="${RELEASE_PRERELEASE:?RELEASE_PRERELEASE is required}"
repository="$(printf '%s' "${CONTAINER_IMAGE_REPOSITORY:-ghcr.io/YewFence/YewSeal}" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
registry="${repository%%/*}"
if [[ "${repository}" != */* || ( "${registry}" != *.* && "${registry}" != *:* && "${registry}" != "localhost" ) ]]; then
  echo "CONTAINER_IMAGE_REPOSITORY must be a complete registry/repository name" >&2
  exit 1
fi

tag_args=(--tags "${release_tag}")
if [[ "${release_prerelease}" == "false" ]]; then
  tag_args+=(--tags latest)
elif [[ "${release_prerelease}" != "true" ]]; then
  echo "RELEASE_PRERELEASE must be true or false" >&2
  exit 1
fi

KO_DOCKER_REPO="${repository}" ko build --bare --platform=all "${tag_args[@]}" ./cmd/yews
"""

[tasks.'actions:pin:check']
# Need github token to avoid rate limit
description = "Check for action pinned version"
run = "pinact run --check"

[tasks.'actions:outdated']
# Need github token to avoid rate limit
description = "Check for outdated action versions"
run = "pinact run --update --diff"

[tasks.'actions:versions:check']
description = "Check pinned GitHub Action versions and outdated releases"
run = [
  { task = "actions:pin:check" },
  { task = "actions:outdated" },
]

[tasks.'release:version']
description = "Print the next release version without the v prefix"
shell = "bash -c"
run = """
version="$(git cliff --bumped-version)"
version="${version#v}"
if [[ -z "${version}" ]]; then
  echo "git cliff did not resolve a version"
  exit 1
fi

printf '%s\\n' "${version}"
"""

[tasks.'release:tag']
description = "Print the release tag, automatically generate if RELEASE_TAG is not set"
shell = "bash -c"
run = """
tag="${RELEASE_TAG:-}"
if [[ -z "${tag}" ]]; then
  version="$(mise run release:version)"
  tag="v${version}"
fi
printf '%s\\n' "${tag}"
"""

[tasks.'release:notes']
description = "Generate release notes for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

cliff_mode="--unreleased"
if git tag --points-at HEAD | grep -Fxq "${tag}"; then
  cliff_mode="--current"
fi

output="${RELEASE_NOTES_OUTPUT:-}"
if [[ -n "${output}" ]]; then
  mkdir -p "$(dirname "${output}")"
  git cliff "${cliff_mode}" --tag "${tag}" --strip all > "${output}"

  if [[ ! -s "${output}" ]]; then
    echo "Release ${tag}" > "${output}"
  fi
else
  git cliff "${cliff_mode}" --tag "${tag}" --strip all
fi
"""

[tasks.'release:changelog']
description = "Update CHANGELOG.md for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

if [[ -f CHANGELOG.md ]]; then
  git cliff --unreleased --tag "${tag}" --prepend CHANGELOG.md
else
  git cliff --unreleased --tag "${tag}" --output CHANGELOG.md
fi
"""

[tasks.'release:tag:create']
description = "Create the release tag for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
  existing_commit="$(git rev-list -n 1 "${tag}")"
  current_commit="$(git rev-parse HEAD)"
  if [[ "${existing_commit}" != "${current_commit}" ]]; then
    echo "tag ${tag} already exists, but it does not point to the current commit"
    exit 1
  fi
  echo "tag ${tag} already exists. Skipping tag creation"
else
  git tag -a "${tag}" -m "Release ${tag}"
fi
"""

[tasks.'release:package']
description = "Package the built CLI artifact for a release"
file = "scripts/release-package.sh"
