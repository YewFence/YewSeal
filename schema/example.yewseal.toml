# Full reference example for .yewseal.toml, covering every field.
#
# This file anchors the schema and Go code:
#   - schema/config.cue validates it via cue vet
#   - internal/config strict-unmarshals it in a Go test
#
# Real projects usually need only a subset. Precedence:
# CLI flags > environment variables > config file > defaults

# Exclusions shared by this config's groups; explicit file pairs are unaffected
exclude = ["target/", "node_modules/", "*.example.toml", "!config/example.toml"]

[encryption]

# Explicit file pair: plaintext is the cleartext, encrypted is the ciphertext.
# Paths resolve against the directory containing this config file; absolute
# paths take effect literally but bind the config to a single machine (not
# recommended); ~ is not expanded.
[[encryption.files]]
plaintext = "wrangler.toml"
encrypted = "wrangler.enc.toml"
recipients = ["owner"]
# Override format detection for files with non-standard extensions
[[encryption.files]]
plaintext = ".dev.vars"
encrypted = ".dev.vars.enc"
format = "env"
plaintext_mode = "delivery"
recipients = ["owner"]

# Manage a set of files in bulk via glob patterns
[[encryption.groups]]
patterns = ["config/**/*.toml", "secrets/*.yaml"]
format_rules = ["*.dev.vars=env", "**/*.conf=ini"]
unknown_as_binary = true
recipients = ["owner"]

[recipients]
defaults = ["owner"]

