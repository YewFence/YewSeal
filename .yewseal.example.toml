# YewSeal 配置文件
#
# 配置优先级：
# 1. 命令行参数（最高优先级）
# 2. 环境变量
# 3. 此配置文件
# 4. 默认值（最低优先级）
#
# 所有敏感文件都统一写在 [[encryption.files]] 里：
# - plaintext 表示明文文件
# - encrypted 表示加密文件

[encryption]

[[encryption.files]]
plaintext = "wrangler.toml"
encrypted = "wrangler.enc.toml"

[key]
file_path = ".age/keys.txt"

[recipients]
defaults = ["owner"]

[recipients.registry]
owner = "age1owner..."
