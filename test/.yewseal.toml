# YewSeal 配置文件示例
# 
# 将此文件复制到项目根目录并重命名为 .yewseal.toml 以使用
# 
# 配置优先级：
# 1. 命令行参数（最高优先级）
# 2. 环境变量
# 3. 此配置文件
# 4. 默认值（最低优先级）

[encryption]
# 需要加密的输入文件（TOML 格式）
# 默认值: "wrangler.toml"
input_file = "wrangler.toml"

# 加密后的输出文件（YAML 格式）
# 默认值: "wrangler.enc.yaml"
output_file = "wrangler.enc.yaml"

[key]
# Age 私钥文件路径
# 默认值: ".age/key.txt"
# 
# 重要提示：配置文件只允许存储密钥文件的路径，该配置文件不应该存储密钥值本身！
# 该配置文件可以提交到版本控制系统。
file_path = ".age/key.txt"
