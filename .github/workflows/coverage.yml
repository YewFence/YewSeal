name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise.ci.toml"
      - "mise.ci.lock"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_shims_to_path: true
          cache_key: "mise-coverage-${{ hashFiles('mise.ci.toml', 'mise.ci.lock') }}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-coverage-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-coverage-${{ runner.os }}-

      - name: Generate coverage report
        id: coverage
        run: |
          mise run coverage
          echo "report=coverage.out" >> "$GITHUB_OUTPUT"

      - name: Resolve Codecov CLI
        id: codecov-cli
        run: echo "path=$(mise which codecovcli)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ steps.codecov-cli.outputs.path }}
          files: ${{ steps.coverage.outputs.report }}
          disable_search: true
          fail_ci_if_error: true
          use_oidc: ${{ github.event_name != 'pull_request' }}

      - name: Summarize coverage failure
        if: ${{ failure() }}
        run: |
          {
            echo "## Coverage upload failed"
            echo
            echo "Coverage report generation or Codecov upload failed. Inspect the preceding step logs."
          } >> "${GITHUB_STEP_SUMMARY}"
