name: Create Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag"
        required: true
        type: string
      update_stable_tags:
        description: "是否覆盖 latest / lite 稳定标签"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      should_release: ${{ steps.release.outputs.should_release }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      update_stable_tags: ${{ steps.release.outputs.update_stable_tags }}
    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          filter: blob:none

      - name: Compute semantic version
        id: semantic
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          ignore_commits_pattern: '/^(?!(fix|feat|perf)(\(.+\))?!?:|[a-z]+(\(.+\))?!:).*/'

      - name: Resolve explicit tag
        id: explicit
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-${REF_NAME}}"
          if [[ -z "${tag}" ]]; then
            echo "tag 不能为空"
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "checkout_ref=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve release metadata
        id: release
        env:
          EXPLICIT_TAG: ${{ steps.explicit.outputs.tag }}
          EXPLICIT_CHECKOUT_REF: ${{ steps.explicit.outputs.checkout_ref }}
          SEMANTIC_TAG: ${{ steps.semantic.outputs.version_tag }}
          SEMANTIC_CHANGED: ${{ steps.semantic.outputs.changed }}
          SEMANTIC_TYPE: ${{ steps.semantic.outputs.version_type }}
          SEMANTIC_IS_TAGGED: ${{ steps.semantic.outputs.is_tagged }}
          SEMANTIC_CURRENT_COMMIT: ${{ steps.semantic.outputs.current_commit }}
          UPDATE_STABLE_TAGS: ${{ inputs.update_stable_tags }}
        run: |
          tag=""
          checkout_ref="${GITHUB_SHA}"
          should_release="false"
          create_tag="false"

          if [[ -n "${EXPLICIT_TAG}" ]]; then
            tag="${EXPLICIT_TAG}"
            checkout_ref="${EXPLICIT_CHECKOUT_REF}"
            should_release="true"
          elif [[ "${SEMANTIC_CHANGED}" == "true" && "${SEMANTIC_TYPE}" != "none" && "${SEMANTIC_IS_TAGGED}" != "true" && -n "${SEMANTIC_TAG}" ]]; then
            tag="${SEMANTIC_TAG}"
            checkout_ref="${SEMANTIC_CURRENT_COMMIT:-${GITHUB_SHA}}"
            should_release="true"
            create_tag="true"
          else
            tag="${SEMANTIC_TAG}"
          fi

          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "checkout_ref=${checkout_ref}"
            echo "should_release=${should_release}"
            echo "create_tag=${create_tag}"
            echo "update_stable_tags=${UPDATE_STABLE_TAGS:-false}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG}"
          mkdir -p dist
          BINARY_NAME="yews${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.Version=${VERSION}" -o "dist/${BINARY_NAME}" ./cmd/yews/

      - name: Create archive
        run: |
          cd dist
          BINARY_NAME="yews${{ matrix.ext }}"
          ARCHIVE_NAME="yews-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "${ARCHIVE_NAME}.zip" "${BINARY_NAME}"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "${BINARY_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: yews-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/yews-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            dist/yews-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 1
  docker:
    name: Publish Docker Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: ${{ needs.version.outputs.should_release == 'true' }}
    concurrency:
      group: release-docker-publish
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            target: full
            suffix: ""
            stable_tag: latest
          - variant: lite
            target: lite
            suffix: "-lite"
            stable_tag: lite
    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        env:
          RAW_TAG: ${{ needs.version.outputs.tag }}
          UPDATE_STABLE_TAGS: ${{ needs.version.outputs.update_stable_tags }}
          IMAGE: ghcr.io/yewfence/yew-seal
          SUFFIX: ${{ matrix.suffix }}
          STABLE_TAG: ${{ matrix.stable_tag }}
        run: |
          git fetch --tags --force

          raw_tag="${RAW_TAG}"
          image="${IMAGE}"
          suffix="${SUFFIX}"
          stable_tag="${STABLE_TAG}"
          should_update_stable="false"

          if [[ -z "${raw_tag}" ]]; then
            echo "tag 不能为空"
            exit 1
          fi

          tags=(
            "${image}:${raw_tag}${suffix}"
          )

          version="${raw_tag#v}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            major_minor="$(cut -d. -f1-2 <<< "${version}")"
            latest_minor_tag="$(
              git tag --list "v${major_minor}.*" --sort=-version:refname \
                | grep -E "^v${major_minor//./\\.}\.[0-9]+$" \
                | head -n 1 \
                || true
            )"
            tags+=("${image}:${version}${suffix}")
            if [[ "${latest_minor_tag}" == "${raw_tag}" ]]; then
              tags+=("${image}:${major_minor}${suffix}")
            fi
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[-.].*$ ]]; then
            tags+=("${image}:${version}${suffix}")
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${UPDATE_STABLE_TAGS}" == "true" ]]; then
              should_update_stable="true"
            fi
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_stable_tag="$(
              git tag --list 'v*' --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | head -n 1 \
                || true
            )"
            if [[ -n "${latest_stable_tag}" && "${latest_stable_tag}" == "${raw_tag}" ]]; then
              should_update_stable="true"
            fi
          fi

          if [[ "${should_update_stable}" == "true" ]]; then
            tags+=("${image}:${stable_tag}")
          fi

          {
            echo "version=${raw_tag}"
            echo "should_update_stable=${should_update_stable}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.docker_meta.outputs.version }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - version
      - build
      - docker
    if: ${{ needs.version.outputs.should_release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Create semantic tag
        if: ${{ needs.version.outputs.create_tag == 'true' }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "${existing_commit}" != "${current_commit}" ]]; then
              echo "tag ${RELEASE_TAG} 已存在，但不指向当前提交"
              exit 1
            fi
            echo "tag ${RELEASE_TAG} 已存在，跳过创建"
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Tagged Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
