name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag"
        required: true
        type: string
      update_stable_tags:
        description: "是否覆盖 latest / lite 稳定标签"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      should_release: ${{ steps.release.outputs.should_release }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      update_stable_tags: ${{ steps.release.outputs.update_stable_tags }}
    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          filter: blob:none

      - name: Compute semantic version
        id: semantic
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        uses: PaulHatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          ignore_commits_pattern: '/^(?!(fix|feat|perf)(\(.+\))?!?:|[a-z]+(\(.+\))?!:).*/'

      - name: Resolve explicit tag
        id: explicit
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-${REF_NAME}}"
          if [[ -z "${tag}" ]]; then
            echo "tag 不能为空"
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "checkout_ref=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve release metadata
        id: release
        env:
          EXPLICIT_TAG: ${{ steps.explicit.outputs.tag }}
          EXPLICIT_CHECKOUT_REF: ${{ steps.explicit.outputs.checkout_ref }}
          SEMANTIC_TAG: ${{ steps.semantic.outputs.version_tag }}
          SEMANTIC_CHANGED: ${{ steps.semantic.outputs.changed }}
          SEMANTIC_TYPE: ${{ steps.semantic.outputs.version_type }}
          SEMANTIC_IS_TAGGED: ${{ steps.semantic.outputs.is_tagged }}
          SEMANTIC_CURRENT_COMMIT: ${{ steps.semantic.outputs.current_commit }}
          UPDATE_STABLE_TAGS: ${{ inputs.update_stable_tags }}
        run: |
          tag=""
          checkout_ref="${GITHUB_SHA}"
          should_release="false"
          create_tag="false"

          if [[ -n "${EXPLICIT_TAG}" ]]; then
            tag="${EXPLICIT_TAG}"
            checkout_ref="${EXPLICIT_CHECKOUT_REF}"
            should_release="true"
          elif [[ "${SEMANTIC_CHANGED}" == "true" && "${SEMANTIC_TYPE}" != "none" && "${SEMANTIC_IS_TAGGED}" != "true" && -n "${SEMANTIC_TAG}" ]]; then
            tag="${SEMANTIC_TAG}"
            checkout_ref="${SEMANTIC_CURRENT_COMMIT:-${GITHUB_SHA}}"
            should_release="true"
            create_tag="true"
          else
            tag="${SEMANTIC_TAG}"
          fi

          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "checkout_ref=${checkout_ref}"
            echo "should_release=${should_release}"
            echo "create_tag=${create_tag}"
            echo "update_stable_tags=${UPDATE_STABLE_TAGS:-false}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: go
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-{{file_hash}}"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-
            go-${{ runner.os }}-

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          binary_name="yews${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.Version=${RELEASE_TAG}" -o "dist/${binary_name}" ./cmd/yews/

      - name: Create archive
        run: |
          cd dist
          binary_name="yews${{ matrix.ext }}"
          archive_name="yews-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "${archive_name}.zip" "${binary_name}"
          else
            tar -czf "${archive_name}.tar.gz" "${binary_name}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yews-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/yews-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            dist/yews-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish Docker Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: ${{ needs.version.outputs.should_release == 'true' }}
    concurrency:
      group: release-docker-publish
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            target: full
            suffix: ""
            stable_tag: latest
          - variant: lite
            target: lite
            suffix: "-lite"
            stable_tag: lite
    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        env:
          RAW_TAG: ${{ needs.version.outputs.tag }}
          CREATE_TAG: ${{ needs.version.outputs.create_tag }}
          UPDATE_STABLE_TAGS: ${{ needs.version.outputs.update_stable_tags }}
          IMAGE: ghcr.io/yewfence/yew-seal
          SUFFIX: ${{ matrix.suffix }}
          STABLE_TAG: ${{ matrix.stable_tag }}
        run: |
          git fetch --tags --force

          raw_tag="${RAW_TAG}"
          create_tag="${CREATE_TAG}"
          image="${IMAGE}"
          suffix="${SUFFIX}"
          stable_tag="${STABLE_TAG}"
          should_update_stable="false"

          if [[ -z "${raw_tag}" ]]; then
            echo "tag 不能为空"
            exit 1
          fi

          tags=(
            "${image}:${raw_tag}${suffix}"
          )

          version="${raw_tag#v}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            major_minor="$(cut -d. -f1-2 <<< "${version}")"
            latest_minor_tag="$(
              git tag --list "v${major_minor}.*" --sort=-version:refname \
                | grep -E "^v${major_minor//./\\.}\.[0-9]+$" \
                | head -n 1 \
                || true
            )"
            tags+=("${image}:${version}${suffix}")
            if [[ "${latest_minor_tag}" == "${raw_tag}" || "${create_tag}" == "true" ]]; then
              tags+=("${image}:${major_minor}${suffix}")
            fi
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[-.].*$ ]]; then
            tags+=("${image}:${version}${suffix}")
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${UPDATE_STABLE_TAGS}" == "true" ]]; then
              should_update_stable="true"
            fi
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_stable_tag="$(
              git tag --list 'v*' --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | head -n 1 \
                || true
            )"
            if [[ -n "${latest_stable_tag}" && "${latest_stable_tag}" == "${raw_tag}" ]]; then
              should_update_stable="true"
            fi
            if [[ "${create_tag}" == "true" ]]; then
              should_update_stable="true"
            fi
          fi

          if [[ "${should_update_stable}" == "true" ]]; then
            tags+=("${image}:${stable_tag}")
          fi

          {
            echo "version=${raw_tag}"
            echo "should_update_stable=${should_update_stable}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.docker_meta.outputs.version }}

  release:
    name: Publish GitHub Release
    needs:
      - version
      - build
      - docker
    if: ${{ needs.version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Create semantic tag
        if: ${{ needs.version.outputs.create_tag == 'true' }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "${existing_commit}" != "${current_commit}" ]]; then
              echo "tag ${RELEASE_TAG} 已存在，但不指向当前提交"
              exit 1
            fi
            echo "tag ${RELEASE_TAG} 已存在，跳过创建"
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
