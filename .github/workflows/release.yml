name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag"
        required: true
        type: string
      update_stable_tags:
        description: "是否覆盖 latest / lite 稳定标签"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          mkdir -p dist
          BINARY_NAME="yews-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.Version=${VERSION}" -o "dist/${BINARY_NAME}" ./cmd/yews/

      - name: Create archive
        run: |
          cd dist
          BINARY_NAME="yews-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "yews-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${BINARY_NAME}"
          else
            tar -czf "yews-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${BINARY_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: yews-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/yews-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Tagged Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish Docker Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            target: full
            suffix: ""
            stable_tag: latest
          - variant: lite
            target: lite
            suffix: "-lite"
            stable_tag: lite
    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag 不能为空"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        run: |
          raw_tag="${{ inputs.tag || github.ref_name }}"
          image="ghcr.io/yewfence/yew-seal"
          suffix="${{ matrix.suffix }}"
          stable_tag="${{ matrix.stable_tag }}"
          should_update_stable="false"

          if [[ -z "${raw_tag}" ]]; then
            echo "tag 不能为空"
            exit 1
          fi

          tags=(
            "${image}:${raw_tag}${suffix}"
          )

          version="${raw_tag#v}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            major_minor="$(cut -d. -f1-2 <<< "${version}")"
            latest_minor_tag="$(
              git tag --list "v${major_minor}.*" --sort=-version:refname \
                | grep -E "^v${major_minor//./\\.}\.[0-9]+$" \
                | head -n 1 \
                || true
            )"
            tags+=("${image}:${version}${suffix}")
            if [[ "${latest_minor_tag}" == "${raw_tag}" ]]; then
              tags+=("${image}:${major_minor}${suffix}")
            fi
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[-.].*$ ]]; then
            tags+=("${image}:${version}${suffix}")
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.update_stable_tags }}" == "true" ]]; then
              should_update_stable="true"
            fi
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_stable_tag="$(
              git tag --list 'v*' --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | head -n 1 \
                || true
            )"
            if [[ -n "${latest_stable_tag}" && "${latest_stable_tag}" == "${raw_tag}" ]]; then
              should_update_stable="true"
            fi
          fi

          if [[ "${should_update_stable}" == "true" ]]; then
            tags+=("${image}:${stable_tag}")
          fi

          {
            echo "version=${raw_tag}"
            echo "should_update_stable=${should_update_stable}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.docker_meta.outputs.version }}
