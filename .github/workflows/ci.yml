name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: go golangci-lint
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.toml', 'mise.lock') }}"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-ci-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ hashFiles('mise.toml') }}-

      - name: Check go.mod tidy
        run: mise run tidy:check

      - name: Vet
        run: mise run vet

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    env:
      MISE_ENV: ci
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.toml', 'mise.ci.toml', 'mise.lock', 'mise.ci.lock') }}"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-audit-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.ci.toml', 'go.sum') }}
          restore-keys: |
            go-audit-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.ci.toml') }}-

      - name: Verify dependencies
        run: mise run mod:verify

      - name: Run govulncheck
        run: mise run audit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: node pnpm
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.toml', 'mise.lock') }}"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Build
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  cli-docs:
    name: Generate CLI Docs
    runs-on: ubuntu-latest
    env:
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: go
          add_shims_to_path: true
          cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-${{ hashFiles('mise.toml', 'mise.lock') }}"

      - name: Generate CLI docs
        run: mise run docs

      - name: Check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Documentation is out of date. Please run 'mise run docs' and commit the changes."
            exit 1
          fi

  docker:
    name: Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [full, lite]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
